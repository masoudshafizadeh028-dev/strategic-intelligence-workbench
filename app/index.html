<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>چت با مدل</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #6366f1;
      --accent-2: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(99,102,241,.18), transparent 60%),
                  radial-gradient(1000px 500px at 10% 110%, rgba(34,211,238,.12), transparent 60%), var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(23,26,33,.7);
      backdrop-filter: blur(8px);
    }
    header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .logo {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #fff; font-weight: 800;
    }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
    main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 76%; padding: 12px 16px; border-radius: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #4f46e5); border-bottom-left-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg.typing { color: var(--muted); font-style: italic; }
    .empty { margin: auto; text-align: center; color: var(--muted); }
    .empty h2 { color: var(--text); margin-bottom: 8px; }
    footer { padding: 14px 22px; border-top: 1px solid var(--border); background: rgba(23,26,33,.7); }
    .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
    textarea {
      flex: 1; resize: none; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font: inherit; outline: none; min-height: 44px; max-height: 160px;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, var(--accent), #4f46e5); color: #fff;
      border: none; border-radius: 12px; padding: 0 20px; font: inherit; font-weight: 600;
      cursor: pointer; transition: transform .1s, opacity .2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { max-width: 900px; margin: 8px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">HF</div> چت با مدل</div>
    <div class="status"><span class="dot" id="dot"></span><span id="model-label">اتصال...</span></div>
  </header>

  <main id="main">
    <div class="empty" id="empty">
      <h2>سلام! 👋</h2>
      <p>پیامت رو بنویس تا با مدل گفت‌وگو کنی.</p>
    </div>
  </main>

  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="پیام خود را بنویسید... (Enter برای ارسال)"></textarea>
      <button id="send">ارسال</button>
    </div>
    <div class="hint" id="model-label-bottom"></div>
  </footer>

  <script>
    const main = document.getElementById('main');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const dot = document.getElementById('dot');
    const modelLabel = document.getElementById('model-label');
    const modelLabelBottom = document.getElementById('model-label-bottom');

    const history = [];

    function addMsg(role, text) {
      document.getElementById('empty')?.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      main.appendChild(el);
      main.scrollTop = main.scrollHeight;
      return el;
    }

    function setTyping(on) {
      const el = document.getElementById('typing');
      if (on) {
        if (!el) {
          const t = document.createElement('div');
          t.id = 'typing';
          t.className = 'msg bot typing';
          t.textContent = 'در حال نوشتن...';
          main.appendChild(t);
          main.scrollTop = main.scrollHeight;
        }
      } else {
        el?.remove();
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = '';
      addMsg('user', text);
      history.push({ role: 'user', content: text });
      setTyping(true);
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'خطا');
        setTyping(false);
        addMsg('bot', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      } catch (e) {
        setTyping(false);
        addMsg('bot', '⚠️ ' + (e.message || 'خطای ناشناخته'));
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    fetch('/health').then(r => r.json()).then(d => {
      dot.classList.add('on');
      modelLabel.textContent = 'آنلاین';
      modelLabelBottom.textContent = 'مدل: ' + (d.model || '');
    }).catch(() => { modelLabel.textContent = 'آفلاین'; });
  </script>
</body>
</html>

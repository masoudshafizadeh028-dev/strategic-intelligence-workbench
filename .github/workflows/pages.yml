name: Pages

# انتشار داشبورد ایستا (کاملاً آفلاین؛ قابلیت‌های سرور با fallback محلی)
on:
  push:
    branches: [main]
    paths:
      - "app/doctrine.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp app/doctrine.html _site/index.html
          printf 'User-agent: *\nDisallow:\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

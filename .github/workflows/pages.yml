name: Pages

# بسته ایستای داشبورد (کاملاً آفلاین) به‌صورت artifact قابل دانلود.
# استقرار خودکار Pages نیازمند پلن پولی برای ریپوی خصوصی است؛
# در صورت عمومی‌شدن ریپو، job deploy را برگردانید.
on:
  push:
    branches: [main]
    paths:
      - "app/doctrine.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp app/doctrine.html _site/index.html
          printf 'User-agent: *\nDisallow:\n' > _site/robots.txt
          test -s _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: doctrine-dashboard
          path: _site

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (fully offline)
        run: python -m pytest app/tests/ -q
      - name: Validate dossier schema sample
        run: |
          python app/cli.py analyze --text "انسجام ملی و وحدت" --format json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['schema_version']=='1.0' and d['claims'], 'bad dossier'"
